services:
  # ASP.NET Core API, built from the existing Dockerfile
  - type: web
    name: construction-management-api
    runtime: docker
    dockerfilePath: ./Dockerfile.vercel
    dockerContext: .
    plan: free
    healthCheckPath: /api/projects
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__Provider
        value: Sqlite
      - key: CONSTRUCTION_JWT_KEY
        generateValue: true

  # Angular dashboard, served as a static site
  - type: web
    name: construction-management-web
    runtime: static
    buildCommand: cd src/Web && npm ci && npm run build
    staticPublishPath: src/Web/dist/web/browser
    routes:
      # Proxy API calls to the API service above.
      - type: rewrite
        source: /api/*
        destination: https://construction-management-api-90nr.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
